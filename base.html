<!DOCTYPE html><html><head>
    <title>RSS阅读 - RSS Reader Web App Hosted On Github</title>
    <meta name="description" content="rssTea is a fast, lightweight RSS and podcast Web Viewer that can be hosted On Github Pages."/>
    <link rel="shortcut icon" href="favicon.ico"> 
  <link rel="icon" href="favicon.png">
<link rel="manifest" href="manifest.json" />
 <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="rdx" />
    <meta   name="apple-mobile-web-app-status-bar-style" content="default" />
     <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <meta charset="utf-8">
    <link rel="stylesheet" href="theme.css" type="text/css">
</head>
<body>
<div id="header"><span class="brand-mark">☷</span><span class="brand-name">Ember</span><div class="global-search"><span>⌕</span><input id="article-search" type="search" placeholder="搜索文章、订阅源和笔记…"></div><div class="header-actions"><button type="button" id="toggle-layout" title="切换紧凑视图">▥</button><button type="button" id="refresh-view" title="刷新页面">↻</button><button type="button" id="theme-toggle" title="切换主题">☾</button><span class="admin-pill">RSS Reader</span></div></div>
<div class="page-layout">
<aside id="category_sidebar">
  <div class="sidebar-heading">RSS 分类</div>
  <button class="category-filter active" type="button" data-category="All"><span>全部订阅</span><small><!-- category total here --></small></button>
  <!-- categories here -->
</aside>
<main id="main_content">
  <div id="filter"><span id="filters">
  <span class="tab active">All</span>
  <span class="tab">Posts</span>
  <span class="tab">Podcasts</span>
  <select name="changechannel"><!-- options here --></select></span></div>
  <div class="reader-columns"><section id="wrap" aria-label="文章列表">
  <!-- posts here -->
  </section><article id="article-detail" aria-live="polite"><div class="detail-empty"><span class="detail-spark">✦</span><h2>选择一篇文章</h2><p>在中间列表中选择文章，查看摘要和详细内容。</p></div></article></div>
</main>
</div>
 
<div id="floating_player">
<div class="player_meta"><button id="playpausebutton">Play</button><span id="title">Not Playing</span> <button id="speed">1x</button><button id="plus30">+30s</button></div>
  <div id="timeline_wrap">
  <ul id="chapters"></ul>
    <span id="current_time"></span>
    <span id="timeline">
<input type="range" id="seekbar" min="0" max="100" step="0.1">
</span>
    <span id="duration"></span>
  </div>
</div>

<script>
const tabs = document.querySelectorAll('.tab');
const posts = Array.from(document.querySelectorAll('.post'));
const select = document.querySelector('select[name="changechannel"]');
const categoryButtons = document.querySelectorAll('.category-filter');
let selectedChannel = 'All';
let selectedCategory = 'All';
let selectedType = 'All';

function applyFilters() {
    posts.forEach(post => {
        const channel = post.getAttribute('data-channel');
        const category = post.getAttribute('data-category') || '未分类';
        const audio = parseInt(post.getAttribute('data-audio'), 10);
        const typeMatch = selectedType === 'All' ||
            (selectedType === 'Posts' && audio === 0) ||
            (selectedType === 'Podcasts' && audio === 1);
        const channelMatch = selectedChannel === 'All' || channel === selectedChannel;
        const categoryMatch = selectedCategory === 'All' || category === selectedCategory;
        post.style.display = typeMatch && channelMatch && categoryMatch ? '' : 'none';
    });
}

select.addEventListener('change', () => {
    selectedChannel = select.value;
    tabs.forEach(tab => tab.classList.toggle('active', tab.textContent.trim() === selectedType));
    select.classList.toggle('selected', selectedChannel !== 'All');
    applyFilters();
});

tabs.forEach(tab => {
    tab.addEventListener('click', () => {
        selectedType = tab.textContent.trim();
        selectedChannel = 'All';
        select.value = 'All';
        select.classList.remove('selected');
        tabs.forEach(item => item.classList.toggle('active', item === tab));
        applyFilters();
    });
});

categoryButtons.forEach(button => {
    button.addEventListener('click', () => {
        selectedCategory = button.dataset.category || 'All';
        categoryButtons.forEach(item => item.classList.toggle('active', item === button));
        applyFilters();
    });
});

const detailPane = document.getElementById('article-detail');
const searchInput = document.getElementById('article-search');
const allPosts = Array.from(document.querySelectorAll('.post'));
function showDetail(post) {
  allPosts.forEach(item => item.classList.toggle('selected-article', item === post));
  const copy = post.cloneNode(true);
  copy.classList.add('detail-copy');
  copy.classList.remove('selected-article');
  copy.style.display = 'flex';
  copy.querySelectorAll('a').forEach(a => { a.target = '_blank'; a.rel = 'noopener noreferrer'; });
  copy.querySelectorAll('.audio button[data-aid]').forEach(btn => {
    btn.addEventListener('click', event => {
      event.preventDefault(); event.stopPropagation();
      const original = post.querySelector('.audio button[data-aid]');
      if (original) original.click();
    });
  });
  detailPane.replaceChildren(copy);
  detailPane.scrollTop = 0;
}
allPosts.forEach(post => {
  post.setAttribute('tabindex','0');
  post.setAttribute('role','button');
  post.addEventListener('click', event => {
    if (event.target.closest('a,button,audio,select')) return;
    showDetail(post);
  });
  post.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); showDetail(post); }
  });
});
if (allPosts.length) showDetail(allPosts[0]);
if (searchInput) searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLocaleLowerCase();
  allPosts.forEach(post => {
    const hay = post.textContent.toLocaleLowerCase();
    post.dataset.searchMatch = (!q || hay.includes(q)) ? '1' : '0';
  });
  applyFilters();
});
const originalApplyFilters = applyFilters;
applyFilters = function() {
  originalApplyFilters();
  const q = searchInput ? searchInput.value.trim().toLocaleLowerCase() : '';
  allPosts.forEach(post => {
    if (q && !post.textContent.toLocaleLowerCase().includes(q)) post.style.display = 'none';
  });
};
document.getElementById('refresh-view')?.addEventListener('click', () => location.reload());
document.getElementById('toggle-layout')?.addEventListener('click', () => document.body.classList.toggle('compact-view'));
document.getElementById('theme-toggle')?.addEventListener('click', () => document.body.classList.toggle('warm-dark'));

document.addEventListener('DOMContentLoaded', function ()
{
    const btns = document.querySelectorAll('.audio button[data-aid]');
    let caudio = null;
    let ppBtn = null;
    const fpBtn = document.querySelector('#floating_player #playpausebutton');
    const tl = document.querySelector('#timeline');
    const fsb = document.querySelector('#seekbar');

    fpBtn.addEventListener('click', function ()
    {
        togglePP();
    });

    function togglePP()
    {
        if (caudio && caudio.paused)
        {
            caudio.play();
        }
        else if (caudio)
        {
            caudio.pause();
        }
    }

    tl.addEventListener('input', function (e)
    {
        const seekPercentage = fsb.value;
        const seekTime = (seekPercentage / 100) * caudio.duration;
        caudio.currentTime = seekTime;
    });

    const speeds = [1, 1.2, 1.5, 1.75, 2];
    let currentSpeedIndex = 0;
    document.getElementById('speed').addEventListener('click', () =>
    {
        currentSpeedIndex = (currentSpeedIndex + 1) % speeds.length;
        const speed = speeds[currentSpeedIndex];
        caudio.playbackRate = speed;
        document.getElementById('speed').innerText = speed + 'x';
        updatePositionState();
    });
    document.getElementById('plus30').addEventListener('click', () =>
    {
        caudio.currentTime += 30;
    });

    function updateAudioTime()
    {
        const currentTime = caudio.currentTime;
        const formattedCurrentTime = formatTime(currentTime);
        const formattedDuration = formatTime(caudio.duration);

        document.getElementById('current_time').textContent = formattedCurrentTime;
        document.getElementById('duration').textContent = formattedDuration;
        const progress = (currentTime / caudio.duration) * 100;
        fsb.value = progress;
    }

    function playTime()
    {
        if (navigator.mediaSession) navigator.mediaSession.playbackState = 'playing';
        fpBtn.classList.add('playing');
        if (ppBtn) { ppBtn.classList.add('playing'); ppBtn.textContent = 'Ⅱ 暂停'; }
        if (caudio) caudio.closest('.post')?.classList.add('is-playing');
        updatePositionState();
    }

    function pauseTime()
    {
        if (navigator.mediaSession) navigator.mediaSession.playbackState = 'paused';
        fpBtn.classList.remove('playing');
        if (ppBtn) { ppBtn.classList.remove('playing'); ppBtn.textContent = '▶ 播放'; }
        if (caudio) caudio.closest('.post')?.classList.remove('is-playing');
        updatePositionState();
    }


    function formatTime(time)
    {
        const minutes = Math.floor(time / 60);
        const seconds = Math.floor(time % 60);
        return ('0' + minutes).slice(-2) + ':' + ('0' + seconds).slice(-2);
    }

    btns.forEach(function (btn)
    {
        btn.addEventListener('click', function ()
        {
            const aid = this.getAttribute('data-aid');
            const audioElem = document.querySelector('audio[aid="' + aid + '"]');
            changePlayback(audioElem);
        });
    });

    function changePlayback(audioElem)
    {
        const prevPPBtn = ppBtn;
        ppBtn = document.querySelector('[data-aid="' + audioElem.getAttribute('aid') + '"]');
        const src = audioElem.getAttribute('src');

        if (caudio && caudio !== audioElem)
        {
            caudio.pause();
            caudio.removeEventListener('timeupdate', updateAudioTime);
            caudio.removeEventListener('play', playTime);
            caudio.removeEventListener('pause', pauseTime);

            prevPPBtn.classList.remove('playing');
            fpBtn.classList.remove('playing');
            fsb.value = '0';

            if (audioElem.readyState >= 1)
            {
                startPlayback(audioElem);
            }
            else
            {
                audioElem.addEventListener('loadedmetadata', function ()
                {
                    startPlayback(audioElem);
                });
            }
        }
        else if (caudio)
        {
            togglePP();
        }
        else
        {
            if (audioElem.readyState >= 1)
            {
                startPlayback(audioElem);
            }
            else
            {
                audioElem.addEventListener('loadedmetadata', function ()
                {
                    startPlayback(audioElem);
                });
            }
        }
    }

    function updatePositionState()
    {
        if (navigator.mediaSession && navigator.mediaSession.setPositionState) navigator.mediaSession.setPositionState(
        {
            duration: caudio.duration,
            playbackRate: caudio.playbackRate,
            position: caudio.currentTime,
        });
    }

    function startPlayback(audioElem)
    {

        const fp = document.querySelector('#floating_player');
        const closestPost = audioElem.closest('.post');
        document.querySelectorAll('.post.nowplaying').forEach(e => e.classList.remove('nowplaying'));
        closestPost.classList.add('nowplaying');
        const h2text = closestPost.querySelector('h2').textContent;
        document.getElementById('title').innerHTML = h2text;
        caudio = audioElem;
        caudio.addEventListener('timeupdate', updateAudioTime);
        caudio.addEventListener('play', playTime);
        caudio.addEventListener('pause', pauseTime);
        const audioDur = caudio.duration;
        const formattedDur = formatTime(audioDur);
        document.getElementById('duration').textContent = formattedDur;
        fp.style.display = 'block';
        setTimeout(function ()
        {
            fp.classList.add("show");
        }, 10);
        caudio.play();

        document.getElementById('speed').innerText = caudio.playbackRate + 'x';
        const mediaAlbumArt = 'https://images1-focus-opensocial.googleusercontent.com/gadgets/proxy?url=' + encodeURIComponent(closestPost.querySelector('img').src) + '&container=focus';
        navigator.mediaSession.metadata = new MediaMetadata(
        {
            title: h2text,
            artist: closestPost.querySelector('.channel').textContent,
            album: "rssTea",
            artwork: [
            {
                src: mediaAlbumArt + '&resize_w=128&resize_h=128',
                sizes: "128x128",
                type: "image/png",
            },
            {
                src: mediaAlbumArt + '&resize_w=96&resize_h=96',
                sizes: "96x96",
                type: "image/png",
            },
            {
                src: mediaAlbumArt + '&resize_w=192&resize_h=192',
                sizes: "192x192",
                type: "image/png",
            },
            {
                src: closestPost.querySelector('img').src,
            }, ],
        });


        const totalAids = document.querySelectorAll('[data-aid]').length;
        let nextAid = Math.floor(audioElem.getAttribute('aid')) + 1;
        let prevAid = Math.floor(audioElem.getAttribute('aid')) - 1;
        if (nextAid > totalAids - 1)
        {
            nextAid = 0;
        }
        if (prevAid < 0)
        {
            prevAid = totalAids - 1;
        }

        navigator.mediaSession && navigator.mediaSession.setActionHandler("play", () =>
        {
            caudio.play();
        });
        navigator.mediaSession.setActionHandler("pause", () =>
        {
            caudio.pause();
        });
        // navigator.mediaSession.setActionHandler("seekto", (details) => {
        //     console.log(details);
        //  if (details.fastSeek && caudio) {
        // const newTime = details.seekTime || 0;
        // caudio.currentTime = newTime;
        //  } else if (caudio) {
        // const currentTime = caudio.currentTime || 0;
        //  const seekTime = details.seekTime || 0;
        //  caudio.currentTime = currentTime + seekTime;
        //  }
        //});


        navigator.mediaSession.setActionHandler(
            'nexttrack',
            () =>
            {
                changePlayback(document.querySelector("[aid=\"" + nextAid + "\"]"));
            }
        );
        navigator.mediaSession.setActionHandler(
            'previoustrack',
            () =>
            {
                changePlayback(document.querySelector("[aid=\"" + prevAid + "\"]"));
            }
        );
        navigator.mediaSession.setActionHandler('seekbackward', (details) =>
        {
            caudio.currentTime = caudio.currentTime - (details.seekOffset || 10);
            updatePositionState();
        });
        navigator.mediaSession.setActionHandler('seekforward', (details) =>
        {
            caudio.currentTime = caudio.currentTime + (details.seekOffset || 10);
            updatePositionState();
        });

    }


});


const deviceWidth = screen.width;
const deviceHeight = screen.height;
const pixelRatio = window.devicePixelRatio || 1;

const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');

canvas.width = deviceWidth * pixelRatio;
canvas.height = deviceHeight * pixelRatio;

ctx.fillStyle = 'white';
if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
{
    ctx.fillStyle = 'black';

}

ctx.fillRect(0, 0, canvas.width, canvas.height);
const iconImage = new Image();
iconImage.src = 'apple-touch-icon.png';

iconImage.onload = function ()
{
    const x = (canvas.width - iconImage.width) / 2;
    const y = (canvas.height - iconImage.height) / 2;

    ctx.drawImage(iconImage, x, y);

    const imageDataURL = canvas.toDataURL('image/png');

    const appleTouchStartupImageLink = document.createElement('link');
    appleTouchStartupImageLink.setAttribute('rel', 'apple-touch-startup-image');
    appleTouchStartupImageLink.setAttribute('href', imageDataURL);
    document.head.appendChild(appleTouchStartupImageLink);
};
        
</script>
</body>
</html>
